# Dev shim: read when running `uv run alembic ...` from backend/.
# Migrations and the packaged config live in xiaotuo/migrations/ (alembic.ini, env.py, versions/);
# equivalently: uv run alembic -c xiaotuo/migrations/alembic.ini upgrade head
# Keep this file ASCII-only: Python reads ini files with the locale encoding (e.g. cp1252 on Windows).
[alembic]
script_location = %(here)s/xiaotuo/migrations
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
