# Xiaotuo local run (Docker). See docs/local-run.md.
# Separate compose project "xiaotuo": container names start with xiaotuo-, the data volume defaults to
# xiaotuo-pgdata (change it with XT_PG_VOLUME), and the database port is not exposed to the host.
# Note: -p does not isolate the volume name; never run `docker compose down -v` on a project that holds data.
name: xiaotuo

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: xiaotuo
      POSTGRES_PASSWORD: ${XT_DB_PASSWORD:?set XT_DB_PASSWORD in .env}
      POSTGRES_DB: xiaotuo
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xiaotuo -d xiaotuo"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  app:
    build:
      context: .
      args:
        # No .git in the image: the version comes from this build arg
        # (e.g. XT_VERSION=$(git describe --tags --always) docker compose build)
        XT_VERSION: ${XT_VERSION:-0.0.0+docker}
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://xiaotuo:${XT_DB_PASSWORD}@db:5432/xiaotuo
      EMAIL_ENABLED: "false"
      COOKIE_SECURE: "false"
      RATELIMIT_MULTIPLIER: ${XT_RATELIMIT_MULTIPLIER:-1}
      # The image defaults COURSE_DIR to the bundled samples; compose uses the read-only mount below
      COURSE_DIR: /course
    volumes:
      # Course directory, mounted read-only; served via COURSE_DIR=/course
      - ${CONTENT_HOST_DIR:-./examples}:/course:ro
    ports:
      - "127.0.0.1:${XT_PORT:-13773}:13773"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:13773/api/health/ready', timeout=3).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped

volumes:
  pgdata:
    # Configurable volume name; the default keeps existing data. Set a different XT_PG_VOLUME for any extra environment.
    name: ${XT_PG_VOLUME:-xiaotuo-pgdata}
